<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사칙연산 계산기</title>

    <script>
        function my_calculator(num1, num2, operator){

            num1 = Number(num1);
            num2 = Number(num2);
            
            switch(operator){
                case "+":
                    return num1 + num2;
                case "-":
                    return num1 - num2;    
                case "*":
                    return num1 * num2;                
                case "/":
                    return num1 / num2;
                default:
                    return "지원하지 않는 연산자입니다";
            }
        }
    </script>

</head>

</body>
</html>
